name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Checks & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: favvmenuz_test
          POSTGRES_USER: favvmenuz_test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-must-be-long-and-secure-for-checks
          DEBUG: "True"
          POSTGRES_DB: favvmenuz_test
          POSTGRES_USER: favvmenuz_test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: |
          python manage.py check

      - name: Check for missing migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-must-be-long-and-secure-for-checks
          DEBUG: "True"
          POSTGRES_DB: favvmenuz_test
          POSTGRES_USER: favvmenuz_test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-must-be-long-and-secure-for-checks
          DEBUG: "True"
          POSTGRES_DB: favvmenuz_test
          POSTGRES_USER: favvmenuz_test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: |
          python manage.py test

  frontend-checks:
    name: Frontend Checks & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Validate Docker Images Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: favvmenuz-backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: favvmenuz-frontend:test

  deploy:
    name: Deploy to AWS Lightsail
    needs: [backend-checks, frontend-checks, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy application on Lightsail
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key ${USER}@${HOST} << 'EOF'
            set -euo pipefail
            APP_DIR="/opt/favvmenuz"
            cd "${APP_DIR}"
            
            echo "[DEPLOY] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "[DEPLOY] Ensuring .env permissions..."
            test -f .env || { echo "[ERROR] .env file not found on host!" >&2; exit 1; }
            chmod 600 .env
            
            echo "[DEPLOY] Building and updating containers..."
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d db redis
            
            echo "[DEPLOY] Running migrations..."
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py migrate --no-input
            
            echo "[DEPLOY] Collecting static files..."
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py collectstatic --no-input
            
            echo "[DEPLOY] Seeding demo catalogue data idempotently..."
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py seed_demo_data
            
            echo "[DEPLOY] Restarting application services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "[DEPLOY] Running health check..."
            sleep 5
            curl -fsS http://localhost/healthz/ || curl -fsS http://127.0.0.1/healthz/
            echo "[SUCCESS] Deployment completed successfully!"
          EOF
